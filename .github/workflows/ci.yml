name: CI

on:
  pull_request:
  push:
    branches: [main]

# 読み取り権限のみ。同じブランチ/PRの古い実行は取り消す
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 複数サーバー(Redis)のテスト(ClusterRedisTest)用。localhost:6379 で使える。なければ、そのテストは飛ばされる
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn -B -ntp test

  # 同じバックエンドのテストを、PostgreSQLでも実行する(複数サーバーのテストも、PostgreSQLとRedisを共有して実行される)
  backend-postgres:
    name: Backend (mvn test, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: raisechat
          POSTGRES_PASSWORD: raisechat-test
          POSTGRES_DB: raisechat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raisechat -d raisechat_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    # CI用の使い捨てDB(サービスコンテナ内)の接続情報。テストはこの環境変数で、SQLiteの代わりにこのDBを使う
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/raisechat_test
      TEST_DB_DRIVER: org.postgresql.Driver
      TEST_DB_POOL: '10'
      TEST_DB_USER: raisechat
      TEST_DB_PASSWORD: raisechat-test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn -B -ntp test

  # docker compose で一式を起動できること(イメージのビルド、全サービスの起動、画面とAPIへの到達)を確認する
  docker:
    name: Docker (compose build / smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI用の使い捨ての値(実際の秘密情報ではない)
      JWT_SECRET: ci-only-secret-for-compose-smoke-test-0123456789abcdef
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: |
          curl -fsS -o /dev/null http://localhost:5173/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/api/auth/login)" = "405"
          # ヘルスチェックはポートが開けば通るため、Redisの購読が始まるまで少し待つ(最大60秒)
          for i in $(seq 30); do
            n="$(docker compose exec -T redis redis-cli pubsub numsub raisechat:events | tail -1)"
            [ "$n" = "2" ] && break
            sleep 2
          done
          test "$n" = "2"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend (lint / test / build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
