# PostgreSQLで動かすプロファイル(SPRING_PROFILES_ACTIVE=postgres)。接続先は、環境変数で指定する:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/raisechat
#   SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver
# SQLiteは書き込みが直列なので接続を1本にしているが、PostgreSQLは並列に使える
spring.datasource.hikari.maximum-pool-size=10
