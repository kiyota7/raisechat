server.port=8080
spring.datasource.url=jdbc:sqlite:raisechat.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=true
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.flyway.enabled=true
# マイグレーションは、DBごとのフォルダ(db/migration/sqlite、db/migration/postgresql)から読む
spring.flyway.locations=classpath:db/migration/{vendor}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload-dir=uploads
# 添付ファイルの保存先: local(既定。app.upload-dir に保存) / s3
# s3 のときは次を設定する(環境変数なら APP_STORAGE_TYPE=s3 のように指定できる)。認証情報はここに書かず、
# AWS標準の取得方法(環境変数 AWS_ACCESS_KEY_ID など / ~/.aws / IAMロール)に任せる
app.storage.type=local
#app.storage.s3.bucket=your-bucket
#app.storage.s3.region=ap-northeast-1
#app.storage.s3.prefix=uploads/
# MinIOなどS3互換サーバーを使うときだけ指定する
#app.storage.s3.endpoint=http://localhost:9000
#app.storage.s3.path-style=true
app.jwt-secret=${JWT_SECRET:raisechat-dev-secret-key-change-me-in-production-0123456789}
# ログインの失敗回数の制限(超えると429)。ユーザーID+IPごと / IPごとの上限と、数える期間
app.login.max-failures=5
app.login.ip-max-failures=20
app.login.window-minutes=15

# 複数サーバー対応: memory(既定。このサーバーのメモリだけで動く) / redis(通知・オンライン状態・ログイン失敗回数をRedisで共有する)
# redis のときは、Redisの接続先(spring.data.redis.host / port。環境変数 SPRING_DATA_REDIS_HOST など)と、
# 全サーバーで同じ JWT_SECRET を設定する。key-prefix は、同じRedisを別の環境と共有するときの区別に使う
app.cluster.mode=memory
#app.cluster.key-prefix=raisechat
#app.cluster.presence-ttl-ms=30000
#app.cluster.presence-heartbeat-ms=10000
spring.data.redis.repositories.enabled=false
