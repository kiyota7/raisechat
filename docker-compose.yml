# RaiseChat 一式: PostgreSQL + Redis + バックエンド(既定2台) + フロントエンド(nginx)
#   cp .env.example .env   # JWT_SECRET と POSTGRES_PASSWORD を設定する
#   docker compose up --build
# 画面: http://localhost:5173
name: raisechat

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raisechat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}
      POSTGRES_DB: raisechat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raisechat -d raisechat"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/raisechat
      SPRING_DATASOURCE_USERNAME: raisechat
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # 複数台で、通知・ログイン失敗回数をRedisで共有する
      APP_CLUSTER_MODE: redis
      SPRING_DATA_REDIS_HOST: redis
      # 全台で同じ値にする(異なると、別の台で発行したログインが無効になる)
      JWT_SECRET: ${JWT_SECRET:?.env に JWT_SECRET を設定してください}
      # nginx(入口)が付けた X-Forwarded-For から、接続元のIPを取り出す
      SERVER_FORWARD_HEADERS_STRATEGY: native
    volumes:
      # 添付ファイルは、台数が複数でも同じ場所を使う(複数ホストにするときは、S3を使う)
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # フロントエンドの固定ポート。ローカルの開発用サーバー(5173)を動かしているときは、先に止める
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
