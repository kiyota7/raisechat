# WebSocketのための、接続の切り替え
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# 利用者が使ったポート(Hostの末尾)。Tomcatは、これがないと、ポートを80とみなす(WebSocketの同一オリジン判定がずれる)
map $http_host $forwarded_port {
  default 80;
  "~:(?<p>\d+)$" $p;
}

server {
  listen 80;
  server_name _;

  # 添付ファイルの上限(バックエンドの spring.servlet.multipart.max-file-size=50MB に合わせる)
  client_max_body_size 50m;

  # バックエンドが複数台のとき、Dockerの名前解決(127.0.0.11)で、台数の変化にも追従する
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $backend http://backend:8080;

  # 接続元のIPは、ここ(入口)で確定させて、バックエンドへ渡す(ログイン失敗の回数制限に使われる)
  proxy_set_header Host $http_host;  # ポート付きのまま渡す(WebSocketの同一オリジン判定に使われる)
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Port $forwarded_port;

  location /api/ {
    proxy_pass $backend;
  }

  location /uploads/ {
    proxy_pass $backend;
  }

  location /ws {
    proxy_pass $backend;
    # nginxは、locationにproxy_set_headerが1つでもあると、上のserverの設定を引き継がない。
    # WebSocketの接続元(Origin)の確認は、Hostとポートを使うので、ここにも同じものを書く
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $forwarded_port;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # WebSocketは、長く繋がったままにする
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # 画面(HTML/JS/CSS)のセキュリティヘッダー。/api と /uploads はバックエンドが付けるので、ここでは重ねない
  # (nginxは、location内にadd_headerがあると上位の設定を引き継がないため、このlocationに直接書く)
  location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
