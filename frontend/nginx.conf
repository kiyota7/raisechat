# WebSocketのための、接続の切り替え
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # 添付ファイルの上限(バックエンドの spring.servlet.multipart.max-file-size=50MB に合わせる)
  client_max_body_size 50m;

  # バックエンドが複数台のとき、Dockerの名前解決(127.0.0.11)で、台数の変化にも追従する
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $backend http://backend:8080;

  # 接続元のIPは、ここ(入口)で確定させて、バックエンドへ渡す(ログイン失敗の回数制限に使われる)
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ {
    proxy_pass $backend;
  }

  location /uploads/ {
    proxy_pass $backend;
  }

  location /ws {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # WebSocketは、長く繋がったままにする
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
