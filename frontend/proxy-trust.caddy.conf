# 本番(docker-compose.prod.yml)で、nginxの/etc/nginx/proxy-trust/ に置く設定。
# nginxはCaddy(同じcomposeの内側のネットワーク)からだけ到達でき、外には公開しないので、
# Caddyが付けた X-Forwarded-* を信用してよい。
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;

# 利用者はHTTPSで繋いでいる(WebSocketの同一オリジン判定とSecure属性のために、バックエンドへ伝える)
set $fwd_proto $http_x_forwarded_proto;
if ($http_x_forwarded_proto = https) {
  set $fwd_port 443;
}
